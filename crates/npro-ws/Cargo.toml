[package]
name        = "npro-ws"
description = "The sans-IO websockets of npro: the handshake, framing and close"
readme      = "../../README.md"
keywords    = ["websocket", "sans-io", "no-std"]
categories  = ["network-programming", "web-programming::websocket", "no-std"]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
homepage.workspace     = true
repository.workspace   = true

[dependencies]
npro-core.workspace = true
npro-h1.workspace   = true
# permessage-deflate's inflater and deflater: docs/dependencies.md
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"], optional = true }

[features]
# permessage-deflate (RFC 7692): needs alloc, for the inflater and deflater
pmd = ["dep:miniz_oxide"]

[dev-dependencies]
npro-core = { workspace = true, features = ["replay"] }

[lints]
workspace = true
