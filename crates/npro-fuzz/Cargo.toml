[package]
name        = "npro-fuzz"
description = "Fuzz harnesses for npro: each target's input handling and its oracle, for libFuzzer and for the smoke tests"
publish     = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
homepage.workspace     = true
repository.workspace   = true

[dependencies]
# its seeded random names a server's random in ss-server, which never draws
npro-core = { path = "../npro-core", features = ["replay"] }
npro-h1   = { path = "../npro-h1" }
npro-io   = { path = "../npro-io" }
npro-json = { path = "../npro-json" }
npro-ss   = { path = "../npro-ss", features = ["pmd"] }
npro-files = { path = "../npro-files" }
npro-proxy = { path = "../npro-proxy" }
npro-cgi   = { path = "../npro-cgi" }
npro-test = { path = "../npro-test" }
npro-ws   = { path = "../npro-ws", features = ["pmd"] }

[lints]
workspace = true
