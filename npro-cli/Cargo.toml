# npro's utility, `npro`: one program, server and client, whose server is
# npro.rs' (docs/ss-design.md, "Where the utility lives").  Its runner is
# the only code that names a loop and a tls provider: the threads adapter,
# and rustls over aws-lc through npro-aws-lc.
#
# A workspace of its own, with its own Cargo.lock and deny.toml, as
# npro-aws-lc is: aws-lc, and caps for dropping the process' privileges,
# enter this graph and never npro's own.  The lints are the main
# workspace's, copied, since a workspace cannot inherit another's.

[package]
name         = "npro-cli"
description  = "npro's utility, server and client in one program, and the runner binding SS2 to a loop and a tls"
version      = "0.0.0"
publish      = false
edition      = "2024"
rust-version = "1.85"
license      = "MIT"

[dependencies]
npro-core   = { path = "../crates/npro-core" }
npro-h1     = { path = "../crates/npro-h1" }
npro-io     = { path = "../crates/npro-io", features = ["std", "rustls"] }
npro-ss     = { path = "../crates/npro-ss", features = ["pmd"] }
npro-files  = { path = "../crates/npro-files" }
npro-proxy  = { path = "../crates/npro-proxy" }
npro-ws     = { path = "../crates/npro-ws", features = ["pmd"] }
npro-aws-lc = { path = "../npro-aws-lc" }
# as npro-aws-lc has it: the config builders, and the provider's random
rustls      = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }

# dropping the capability to bind privileged ports once bound: Andy,
# 2026-10-12; docs/dependencies.md, "The npro-cli workspace"
[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5.6"

[lints.rust]
unsafe_code     = "forbid"
missing_docs    = "deny"
unexpected_cfgs = "deny"

# Off by default in rustc, the nearest thing to C's -Wextra.  Each finds
# something real: an API wider than it is reachable, a dependency nothing
# uses, a type that could be Copy, idioms older editions allowed.
rust_2018_idioms               = { level = "deny", priority = -1 }
unreachable_pub                = "deny"
unused_crate_dependencies      = "deny"
unused_qualifications          = "deny"
unused_lifetimes               = "deny"
redundant_lifetimes            = "deny"
let_underscore_drop            = "deny"
trivial_numeric_casts          = "deny"
missing_debug_implementations  = "deny"
missing_copy_implementations   = "deny"

# What AGENTS.md asks of every crate: nothing that can panic on input, no
# unchecked arithmetic on lengths, no lossy integer casts.  A lint is
# silenced only by an #[expect] on the one item, with a reason.

[lints.clippy]
unwrap_used              = "deny"
expect_used              = "deny"
panic                    = "deny"
unreachable              = "deny"
todo                     = "deny"
unimplemented            = "deny"
indexing_slicing         = "deny"
arithmetic_side_effects  = "deny"
as_conversions           = "deny"
cast_possible_truncation = "deny"
cast_sign_loss           = "deny"
cast_possible_wrap       = "deny"
missing_errors_doc       = "deny"
must_use_candidate       = "deny"

# pedantic: clippy's -Wextra.  Some of it is taste; a lint that fights the
# house style is turned off here, once, with why.
pedantic = { level = "deny", priority = -1 }

# AGENTS.md's rules, as lints rather than comments:
#  - a match on state has no `_ =>` arm, so a new state is handled
#    everywhere or the build fails
wildcard_enum_match_arm = "deny"
#  - a lint is silenced on the one item, with a reason, and with #[expect]
#    rather than #[allow]: #[expect] fails once the lint stops firing, so
#    a stale silencing cannot outlive what it was for
allow_attributes_without_reason = "deny"
allow_attributes                = "deny"
#  - no_std: what only needs core or alloc does not reach for std.  Off
#    here: this is a program, std throughout, never built without it
std_instead_of_core   = "allow"
std_instead_of_alloc  = "allow"
alloc_instead_of_core = "allow"
#  - stack use that is fine on a server and overflows a microcontroller
large_stack_arrays = "deny"
large_stack_frames = "deny"
#  - a library does not print, exit, leak, or panic where it returns errors
print_stdout        = "deny"
print_stderr        = "deny"
dbg_macro           = "deny"
exit                = "deny"
mem_forget          = "deny"
unwrap_in_result    = "deny"
panic_in_result_fn  = "deny"
#  - protocol code has no floating point
float_arithmetic = "deny"
#  - a name reused for something unrelated reads as the old thing
shadow_unrelated = "deny"
#  - from nursery, which is otherwise left off as unfinished
missing_const_for_fn = "deny"

[lints.rustdoc]
private_intra_doc_links   = "deny"
unescaped_backticks       = "deny"
missing_crate_level_docs  = "deny"

[workspace]
